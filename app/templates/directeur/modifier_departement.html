{% extends "base.html" %}

{% block title %}Modifier {{ departement.nom }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-warning">
                    <h4 class="mb-0">
                        <i class="fas fa-edit"></i> Modifier le Département : {{ departement.nom }}
                    </h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('directeur.modifier_departement', dept_id=departement.id) }}">

                        <div class="mb-3">
                            <label for="nom" class="form-label">
                                <i class="fas fa-building"></i> Nom du Département *
                            </label>
                            <input type="text"
                                   class="form-control"
                                   id="nom"
                                   name="nom"
                                   value="{{ departement.nom }}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="code" class="form-label">
                                <i class="fas fa-tag"></i> Code du Département *
                            </label>
                            <input type="text"
                                   class="form-control"
                                   id="code"
                                   name="code"
                                   value="{{ departement.code }}"
                                   maxlength="10"
                                   style="text-transform: uppercase;"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">
                                <i class="fas fa-align-left"></i> Description
                            </label>
                            <textarea class="form-control"
                                      id="description"
                                      name="description"
                                      rows="3">{{ departement.description if departement.description else '' }}</textarea>
                        </div>

                        <div class="mb-3">
                            <label for="chef_id" class="form-label">
                                <i class="fas fa-user-tie"></i> Chef de Département
                            </label>
                            <select class="form-select" id="chef_id" name="chef_id">
                                <option value="">-- Aucun --</option>
                                {% for enseignant in enseignants %}
                                <option value="{{ enseignant.id }}"
                                        {% if departement.chef_id == enseignant.id %}selected{% endif %}>
                                    {{ enseignant.nom }} {{ enseignant.prenom }}
                                    {% if enseignant.specialite %}({{ enseignant.specialite }}){% endif %}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('directeur.detail_departement', dept_id=departement.id) }}"
                               class="btn btn-secondary">
                                <i class="fas fa-times"></i> Annuler
                            </a>
                            <button type="submit" class="btn btn-warning btn-lg">
                                <i class="fas fa-save"></i> Enregistrer les Modifications
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
