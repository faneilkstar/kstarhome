{% extends "base.html" %}
{% block title %}Ma Carte Étudiant{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-header text-white py-3" style="background: linear-gradient(135deg, #DAA520, #FFD700);">
                    <h4 class="mb-0"><i class="fas fa-id-card me-2"></i> Ma Carte Étudiant</h4>
                </div>
                <div class="card-body text-center p-5">
                    {% if carte_path %}
                    <img src="/static/cartes/{{ carte_path.split('/')[-1] }}" class="img-fluid shadow rounded-3 mb-4" style="max-width: 100%; border: 3px solid #DAA520;">
                    {% endif %}
                    <div class="mt-4">
                        <p class="text-muted mb-1"><i class="fas fa-calendar-alt me-1"></i> Émise le : {{ date_emission }}</p>
                        <p class="text-muted mb-3"><i class="fas fa-signature me-1"></i> Visée par : {{ directeur }}</p>
                    </div>
                    <div class="d-flex justify-content-center gap-3 mt-3">
                        <a href="{{ url_for('cartes.telecharger_carte', etudiant_id=etudiant.id) }}" class="btn btn-lg px-4 text-white" style="background: #DAA520;">
                            <i class="fas fa-download me-2"></i> Télécharger
                        </a>
                        <button onclick="window.print()" class="btn btn-lg btn-outline-dark px-4">
                            <i class="fas fa-print me-2"></i> Imprimer
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
